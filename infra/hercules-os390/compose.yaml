# One-time:  ./prepare-os390.sh <path to the TK5 kit>   (Hercules + directories)
#            then install the ADCD volumes in ./os390/dasd and fill in
#            ./os390/conf/os390.cnf (see README)
# Run:       BIND_IP=<tailnet ip> docker compose up -d --build
#
# BIND_IP keeps every port off public interfaces. It defaults to loopback so a
# missing value can never expose the Hercules HTTP console, which has no auth.
# The ports differ from TK5's so both run on one host.
services:
  os390:
    build: .
    image: os390-hercules-runtime:local
    container_name: os390
    restart: unless-stopped
    init: true
    stop_grace_period: 120s
    # The guest's network adapter (LCS/CTCI) needs a tun device, and the NAT
    # to its TN3270E server needs NET_ADMIN (in the container's own netns only).
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      OS390_IP: "${OS390_IP:-}"            # the guest's IP on the tun network, e.g. 10.1.1.2
      OS390_TUN: "${OS390_TUN:-tap0}"
    ports:
      - "${BIND_IP:-127.0.0.1}:${OS390_3270_PORT:-3271}:3270"
      - "${BIND_IP:-127.0.0.1}:${OS390_HTTP_PORT:-8039}:8038"
      - "${BIND_IP:-127.0.0.1}:${OS390_TN3270E_PORT:-2323}:2323"
    volumes:
      - "${OS390_DIR:-./os390}:/os390"
